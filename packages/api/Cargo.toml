[package]
name = "src20-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

# Ethereum / Seismic
alloy = { version = "1.1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors + logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
